<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <!-- PWA: fullscreen on home-screen launch (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Motorola Constellation">
    <link rel="apple-touch-icon" href="assets/logo-nanna.png">
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon-192.png" sizes="192x192">
    <title>Wallpaper - Motorola Constellation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
  </head>
<body>
   <div class="nebula"></div>

   <img src="assets/logo-nanna.png" alt="Nanna" class="logo-nanna" />

    <div class="container">
      <div class="wallpaper-hero">
        <!-- Wallpaper frame: image fills entire frame -->
        <div class="wallpaper-frame" id="wallpaper-frame">
          <div class="spinner" id="spinner"></div>
          <img class="wallpaper-image" alt="Wallpaper" loading="lazy" />
        </div>

        <!-- Title / Subtitle (outside frame, below) -->
        <div class="wallpaper-text">
          <div class="wallpaper-title">Cargando universo...</div>
          <div class="wallpaper-subtitle neon-cyan">El orden no es suerte, es liderazgo ✨</div>
        </div>

        <!-- Actions -->
        <div class="wallpaper-actions">
          <a href="#" class="btn btn-primary btn-download">
            <span>⬇</span> Descargar Wallpaper
          </a>
        </div>

        <!-- Back button (fixed bottom-left) -->
        <a href="index.html" class="back-link">
          ← Volver a la Constelación
        </a>

        <footer class="site-footer">
          <span class="neon-purple">© 2026 Shape Creative Studio LLC</span>
          <span class="neon-cyan" id="section-id">?</span>
        </footer>
      </div>
    </div>

  <script src="js/main.js"></script>
</body>
</html>
